<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>SORT – Assign recording to a ticket</title>
<style>
  :root, [data-theme="dark"] {
    --bg:#0e1116; --panel:#161b22; --panel2:#1b212b; --line:#232a36;
    --line2:#2d3543; --txt:#e8eaed; --muted:#9aa4b2; --dim:#6b7686;
    --accent:#E21A82; --ok:#2e9e70; --warn:#e0a33e; --sel:#1d2b3a;
    --err:#f08a80; --link:#7dd3fc;
  }
  [data-theme="light"] {
    --bg:#f8f9fa; --panel:#ffffff; --panel2:#f1f3f5; --line:#e6e8eb;
    --line2:#d6dae0; --txt:#20242b; --muted:#6b7280; --dim:#9aa1ab;
    --accent:#E21A82; --ok:#1f7a55; --warn:#a06412; --sel:#e3effb;
    --err:#c0392b; --link:#2b6cb0;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; height:100vh; display:flex; flex-direction:column;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size:13px; background:var(--bg); color:var(--txt);
  }
  header {
    padding:12px 16px; border-bottom:1px solid var(--line); background:var(--panel);
    display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
  }
  header h1 { font-size:14px; margin:0; letter-spacing:.3px; }
  header .meta { font-size:12px; color:var(--muted); }
  header .meta b { color:var(--txt); font-variant-numeric:tabular-nums; }

  .bar {
    padding:9px 16px; border-bottom:1px solid var(--line); background:var(--panel);
    display:flex; gap:10px; align-items:center; flex-wrap:wrap;
  }
  input[type=search], input[type=text] {
    background:var(--bg); color:var(--txt); border:1px solid var(--line2);
    border-radius:6px; padding:7px 10px; font-size:12px; font-family:inherit;
  }
  input[type=search] { width:260px; }
  input[type=text] { width:120px; font-variant-numeric:tabular-nums; }
  label.inline { font-size:12px; color:var(--muted); }

  #list { flex:1; overflow:auto; }
  table { width:100%; border-collapse:collapse; }
  th {
    position:sticky; top:0; background:var(--panel2); color:var(--muted);
    font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.4px;
    text-align:left; padding:7px 12px; border-bottom:1px solid var(--line);
  }
  td { padding:7px 12px; border-bottom:1px solid var(--line); vertical-align:top; }
  tbody tr { cursor:pointer; }
  tbody tr:hover { background:var(--panel); }
  tbody tr.sel { background:var(--sel); }
  td.ref { font-variant-numeric:tabular-nums; color:var(--link); white-space:nowrap; }
  td.subj { max-width:420px; }
  td.dim { color:var(--muted); }

  footer {
    padding:12px 16px; border-top:1px solid var(--line); background:var(--panel);
    display:flex; gap:10px; align-items:center; flex-wrap:wrap;
  }
  .btn {
    background:var(--panel2); color:var(--muted); border:1px solid var(--line2);
    border-radius:6px; padding:8px 13px; font-size:12px; font-family:inherit; cursor:pointer;
  }
  .btn:hover { color:var(--txt); border-color:var(--dim); }
  .btn:disabled { opacity:.45; cursor:default; }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.danger { color:var(--err); }
  .btn:focus-visible, tbody tr:focus-visible { outline:2px solid var(--link); outline-offset:1px; }
  .spacer { flex:1; }

  #status { padding:10px 16px; font-size:12px; color:var(--muted); border-top:1px solid var(--line); }
  #status.err { color:var(--err); }
  #status.ok { color:var(--ok); }
  #bar { height:4px; background:var(--panel2); border-radius:2px; overflow:hidden; margin-top:7px; display:none; }
  #bar.on { display:block; }
  #bar i { display:block; height:100%; width:0; background:var(--ok); transition:width .2s; }
  a { color:var(--link); }
</style>
</head>
<body>
  <header>
    <h1>Assign recording to a ticket</h1>
    <div class="meta" id="recMeta">Loading recording…</div>
  </header>

  <div class="bar">
    <input type="search" id="q" placeholder="Filter tickets by number, subject, system or agent">
    <label class="inline" for="manual">Ticket number</label>
    <input type="text" id="manual" inputmode="numeric" placeholder="e.g. 1234">
    <span class="spacer"></span>
    <button class="btn" id="reload">Reload tickets</button>
  </div>

  <div id="list"></div>

  <footer>
    <button class="btn" id="saveLocal">Save locally</button>
    <button class="btn primary" id="saveUpload">Save and upload session</button>
    <button class="btn primary" id="saveUploadOdoo">Upload session and add link to ticket</button>
    <span class="spacer"></span>
    <button class="btn danger" id="discard">Delete recording</button>
  </footer>

  <div id="status">Pick a ticket, or type a number.<div id="bar"><i></i></div></div>

  <script src="defaults.js"></script>
  <script src="theme.js"></script>
  <script src="odoo.js"></script>
  <script src="sortz.js"></script>
  <script src="upload.js"></script>
  <script src="ticket.js"></script>
</body>
</html>
